plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'

}

android {
    namespace 'com.quran.quranaudio.common.ad'
    compileSdk 35

    defaultConfig {
        minSdk 21

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    
    // ===== 16 KB Page Size Support =====
    // Required for Google Play compliance (Android 15+)
    // Ref: https://developer.android.com/guide/practices/page-sizes
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {

    implementation libs.androidx.coreKtx
    implementation libs.androidx.appcompat
    implementation libs.material

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    
    // Google Mobile Ads SDK - Updated to 24.7.0 to match main project
    api 'com.google.android.gms:play-services-ads:24.7.0'
    api 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    
    // Meta Audience Network (Facebook) - Bidding
    api 'com.google.ads.mediation:facebook:6.14.0.0'
    api 'com.facebook.android:audience-network-sdk:6.14.0'
    
    // Unity Ads - Bidding
    api 'com.unity3d.ads:unity-ads:4.8.0'
    api 'com.google.ads.mediation:unity:4.16.0.1'
    
    // Mintegral - Bidding
    api 'com.google.ads.mediation:mintegral:16.4.31.0'
    api 'com.mbridge.msdk.oversea:mbbid:16.4.31'
    
    // Liftoff Monetize (Vungle) - Bidding
    // Updated to 7.6+ to resolve Google Play deprecation warning
    // See: https://developers.google.com/admob/android/mediation/vungle
    api 'com.google.ads.mediation:vungle:7.6.0.0'
    
    // Pangle (ByteDance/TikTok) - Bidding
    // ✅ 16KB 合规版本：6.5.0.4.0 对应 Pangle SDK ads-sdk:6.5.0.4(实测 ELF 段 0x4000=16KB 对齐)。
    //    选此版本原因：① 字节仓库中该 SDK 稳定可达(7.6.0.5 已下架、7.8.5.9 POM 访问超时)；
    //    ② exclude gms 使项目 GMA 保持 24.7.0 不被顶版；③ 适配器(GMA 23.x)运行于更新的 GMA
    //    属向前兼容方向，较稳。⚠️ 严禁用 6.2.0.4.0(旧 SDK 4KB 对齐 → 16KB 拒审)。
    api('com.google.ads.mediation:pangle:6.5.0.4.0') {
        exclude group: 'com.google.android.gms'
    }
    
    // IronSource - Bidding
    // Using Maven Central version
    api('com.google.ads.mediation:ironsource:8.3.0.0') {
        exclude group: 'com.google.android.gms'
    }
    
    // InMobi - Bidding
    api 'com.google.ads.mediation:inmobi:10.6.3.0'

    // ✅ CRITICAL FIX: Updated Firebase BoM to fix NoSuchMethodError crash
    // Old version (30.4.1 from 2022) was incompatible with play-services-ads 22.1.0
    // This caused: NoSuchMethodError: checkNotGoogleApiHandlerThread() in Preconditions
    // Latest BoM ensures all Google Play Services components are compatible
    api platform('com.google.firebase:firebase-bom:33.7.0')

    // Remove explicit versions - let BoM manage them
    api 'com.google.firebase:firebase-config'
    api 'com.google.firebase:firebase-analytics'
    api 'com.google.firebase:firebase-messaging'


}
