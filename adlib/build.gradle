plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'

}

android {
    namespace 'com.quran.quranaudio.common.ad'
    compileSdk 35

    defaultConfig {
        minSdk 21

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {

    implementation libs.androidx.coreKtx
    implementation libs.androidx.appcompat
    implementation libs.material

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    
    // Google Mobile Ads SDK
    api 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    api 'com.google.android.gms:play-services-ads:22.1.0'
    
    // Meta Audience Network (Facebook) - Bidding
    api 'com.google.ads.mediation:facebook:6.14.0.0'
    api 'com.facebook.android:audience-network-sdk:6.14.0'
    
    // Unity Ads - Bidding
    api 'com.unity3d.ads:unity-ads:4.8.0'
    api 'com.google.ads.mediation:unity:4.16.0.1'
    
    // Mintegral - Bidding
    api 'com.google.ads.mediation:mintegral:16.4.31.0'
    api 'com.mbridge.msdk.oversea:mbbid:16.4.31'
    
    // Liftoff Monetize (Vungle) - Bidding
    api 'com.google.ads.mediation:vungle:7.3.0.0'
    
    // Pangle (ByteDance/TikTok) - Bidding
    api 'com.google.ads.mediation:pangle:6.0.0.6.0'
    
    // IronSource - Bidding
    api 'com.google.ads.mediation:ironsource:8.5.0.1'
    
    // InMobi - Bidding
    api 'com.google.ads.mediation:inmobi:10.6.3.0'

    // When using the BoM, don't specify versions in Firebase dependencies
    api platform('com.google.firebase:firebase-bom:30.4.1')

    api 'com.google.firebase:firebase-config:21.1.2'
    api 'com.google.firebase:firebase-analytics'
    api 'com.google.firebase:firebase-messaging:23.0.8'

}
