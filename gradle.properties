org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false

JUNKCODE_ENABLE=true
android.enableR8.fullMode=false
org.gradle.unsafe.transform.cache=false

# Gradle optimization settings to fix resource packaging issues
android.enableAapt2=true
org.gradle.caching=true
# This multi-module project uses KAPT heavily. Parallel Kotlin workers have repeatedly opened the
# same incremental storage (source-to-classes.tab), leaving the compiler daemon with a duplicate
# registration and the unhelpful "Daemon compilation failed: null" error. Prefer deterministic
# builds; the Android/Java workers can still parallelize work internally.
org.gradle.parallel=false
org.gradle.configureondemand=false

# Compile Kotlin inside the Gradle process so Android Studio and command-line builds cannot race a
# stale standalone Kotlin daemon. Incremental Kotlin/KAPT caches are disabled because those caches
# are the confirmed source of the duplicate-storage failure in this project.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
kapt.incremental.apt=false

# ===== 16 KB Page Size Support Configuration =====
# Required for Android 15+ devices and Google Play submission (effective Nov 1, 2025)
# Ref: https://developer.android.com/guide/practices/page-sizes

# Force native libraries to be stored uncompressed in APK/AAB
# This allows proper 16KB memory page alignment
android.bundle.enableUncompressedNativeLibs=true

# Ensure proper alignment for all native code
android.enableNativeCodeAlignment=true
