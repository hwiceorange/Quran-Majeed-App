def secretsPropertiesFile = rootProject.file("secrets.properties")
def secretsProperties = new Properties()

if (secretsPropertiesFile.exists()) {
    secretsProperties.load(new FileInputStream(secretsPropertiesFile))
} else {
    secretsProperties.setProperty("LONDON_UNIFIED_TIMINGS_API_KEY", "${System.getenv('LONDON_UNIFIED_TIMINGS_API_KEY')}")
    secretsProperties.setProperty("CUSTOM_ADHAN_SOUNDS_FOLDER_NAME", "${System.getenv('CUSTOM_ADHAN_SOUNDS_FOLDER_NAME')}")
}

android {
    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.quran.quranaudio.online"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 123
        versionName "1.9.41"
        multiDexEnabled true
        
        // 🔧 Support for 16 KB page sizes (Google Play requirement for Android 15+)
        // Ref: https://developer.android.com/guide/practices/page-sizes
        ndk {
            // Only include ARM architectures for production (x86/x86_64 are for emulators only)
            // arm64-v8a is the primary target for 16KB page size devices
            abiFilters 'armeabi-v7a', 'arm64-v8a'
            
            // Enhanced debug symbol level for better crash analysis
            debugSymbolLevel 'SYMBOL_TABLE'
        }
        
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField("String", "LONDON_UNIFIED_TIMINGS_API_KEY", secretsProperties['LONDON_UNIFIED_TIMINGS_API_KEY'])
        buildConfigField("String", "CUSTOM_ADHAN_SOUNDS_FOLDER_NAME", secretsProperties['CUSTOM_ADHAN_SOUNDS_FOLDER_NAME'])


        // Set BuildConfig.DEVELOPER_MACHINE_IP to the IP address of any interface.
        def ipList = getLocalIPv4()
        buildConfigField("String", "DEVELOPER_MACHINE_IP", ipList.empty ? '""' : '"' + ipList.get(0) + '"')

    }

    kapt {
        correctErrorTypes = true
        useBuildCache = false
        
        javacOptions {
            option("-Xmaxerrs", 500)
            option("-Xlint:deprecation", true)
            option("-Xlint:unchecked", true)
        }
        arguments {
            arg("plugin", "org.jetbrains.kotlin.kapt3:kotlin-allopen")
            arg("plugin", "org.jetbrains.kotlin.kapt3:kotlin-noarg")
        }
    }


    signingConfigs {
        // Google Play 渠道签名配置（保持不变）
        release {
            storeFile file("quran_keystore")//hashcode 1961951595
            keyAlias "key0"
            storePassword "Huwei123"
            keyPassword "Huwei123"
        }
        
        // Transsion 渠道独立签名配置
        transsionConfig {
            def localProperties = new Properties()
            def localPropertiesFile = rootProject.file('local.properties')
            if (localPropertiesFile.exists()) {
                localProperties.load(new FileInputStream(localPropertiesFile))
            }
            
            def keystorePath = localProperties.getProperty('TRANS_STORE_FILE')
            if (keystorePath != null && !keystorePath.startsWith('path/to/')) {
                // 使用 rootProject.file() 从项目根目录解析路径
                storeFile rootProject.file(keystorePath)
                storePassword localProperties.getProperty('TRANS_STORE_PWD')
                keyAlias localProperties.getProperty('TRANS_KEY_ALIAS')
                keyPassword localProperties.getProperty('TRANS_KEY_PWD')
            } else {
                // 占位符配置，提醒用户填写
                println "⚠️  WARNING: Transsion signing config not set in local.properties"
                println "Please update TRANS_STORE_FILE, TRANS_STORE_PWD, TRANS_KEY_ALIAS, TRANS_KEY_PWD"
            }
        }
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
    
    // ===== Product Flavors Configuration =====
    // 渠道配置：googleplay（原有渠道）和 transsion（传音渠道）
    flavorDimensions "market"
    
    productFlavors {
        // Google Play 渠道（保持原有配置）
        googleplay {
            dimension "market"
            
            // Google Play 使用原有的 release 签名
            signingConfig signingConfigs.release
            
            // Google Play 原有的 AdMob App ID
            manifestPlaceholders = [
                admob_app_id: "ca-app-pub-3966802724737141~7853010339"
            ]
            
            // 注入广告位 ID 到 BuildConfig（Google Play 原有配置）
            buildConfigField "String", "ADMOB_APP_ID", '"ca-app-pub-3966802724737141~7853010339"'
            buildConfigField "String", "AD_BANNER", '"ca-app-pub-3966802724737141/3067585143"'
            buildConfigField "String", "AD_INTERSTITIAL", '"ca-app-pub-3966802724737141/5930208744"'
            buildConfigField "String", "AD_NATIVE", '"ca-app-pub-3966802724737141/8016465974"'
            buildConfigField "String", "AD_APP_OPEN", '"ca-app-pub-3966802724737141/9441421809"'
            buildConfigField "String", "AD_REWARDED", '"ca-app-pub-3966802724737141/4492153931"'
        }
        
        // Transsion 渠道（新增配置）
        transsion {
            dimension "market"
            
            // Transsion 渠道使用独立签名
            signingConfig signingConfigs.transsionConfig
            
            // Transsion 专用的 AdMob App ID
            manifestPlaceholders = [
                admob_app_id: "ca-app-pub-3966802724737141~7853010339"
            ]
            
            // 注入 Transsion 专用广告位 ID 到 BuildConfig
            buildConfigField "String", "ADMOB_APP_ID", '"ca-app-pub-3966802724737141~7853010339"'
            buildConfigField "String", "AD_BANNER", '"ca-app-pub-3966802724737141/3067585143"'
            buildConfigField "String", "AD_INTERSTITIAL", '"ca-app-pub-3966802724737141/5930208744"'
            buildConfigField "String", "AD_NATIVE", '"ca-app-pub-3966802724737141/8016465974"'
            buildConfigField "String", "AD_APP_OPEN", '"ca-app-pub-3966802724737141/9441421809"'
            buildConfigField "String", "AD_REWARDED", '"ca-app-pub-3966802724737141/4492153931"'
        }
    }
    
    // AAPT options to fix resource packaging issues
    aaptOptions {
        noCompress 'mp3', 'kml', 'json', 'zip', 'webp', 'xml'
        cruncherEnabled = false
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    
    // Additional packaging options to handle large resource files
    packagingOptions {
        // Exclude duplicate files that cause conflicts
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 
                        'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 
                        'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module']
        }
    }
    
    buildTypes {

        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false

            resValue "string", "cleartextTrafficPermitted", "true"
        }

        release {
            minifyEnabled true
            debuggable false
            //proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            shrinkResources true
            resValue "string", "cleartextTrafficPermitted", "false"

            // 签名配置在 productFlavors 中设置
            // Google Play 使用 release 签名，Transsion 使用 transsionConfig 签名
            
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }
    }
    bundle {
        language {
            enableSplit false //语言不分包
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true

        // Fix OutOfMemory errors
        unitTests {
            all {
                maxParallelForks = 2
                forkEvery = 80 // means only 80 tests will get ran in a single process,
                // so they never hit the heap size.
                maxHeapSize = "2048m"
                minHeapSize = "1024m"
            }
        }
    }

    bundle {
        language {
            enableSplit = false
        }
        
        // ===== 16 KB Page Size Bundle Configuration =====
        // Ensure proper handling of native libraries in AAB format
        // Native libraries will be stored uncompressed for 16KB page alignment
        abi {
            enableSplit = true  // Enable ABI splits for smaller download sizes
        }
        
        // Density splits for optimized APK sizes
        density {
            enableSplit = true
        }
    }


    packagingOptions {
        resources {
            excludes += ['META-INF/atomicfu.kotlin_module']
        }
        
        // ===== 16 KB Page Size Configuration =====
        // Critical for Android 15+ and Google Play compliance
        // Ref: https://developer.android.com/guide/practices/page-sizes
        jniLibs {
            // Store native libraries uncompressed in APK - REQUIRED for 16KB alignment
            useLegacyPackaging = true
            
            // Keep all native libraries (don't strip debug symbols in debug builds)
            keepDebugSymbols += ['**/*.so']
        }
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }



    buildFeatures {
        viewBinding true
        dataBinding true
    }
    namespace 'com.quran.quranaudio.online'
}

